name: Explorador Android (APK)

on:
  push:
    paths:
      - 'explorador_android/**'
      - '.github/workflows/explorador-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorador_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Explorador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Explorador-apk
          path: explorador_android/Explorador.apk
